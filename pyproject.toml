[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omninexus"
version = "0.3.3"
description = "Local-first LLM orchestration core: multi-provider gateway, prompts, memory, search, archives and tagging."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OmniNexus Contributors" }]
keywords = ["llm", "gateway", "local-first", "privacy", "prompts", "rag"]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.8,<3.0",
  "PyYAML>=6.0,<7.0",
  "Jinja2>=3.1,<4.0",
  "python-dotenv>=1.0,<2.0",
  "cryptography>=42,<51",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=5.0,<7.0",
  "asgi-lifespan>=2.1,<3.0",
  "ruff>=0.7,<1.0",
]

[project.scripts]
omninexus = "omninexus.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omninexus = ["static/*", "resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning:starlette.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic.

[tool.coverage.run]
source = ["omninexus"]
branch = true

[tool.coverage.report]
omit = ["*/__main__.py"]
