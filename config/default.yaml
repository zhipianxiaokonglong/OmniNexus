# OmniNexus default configuration.
# This file contains no secrets. API keys are read from the environment variable
# named by each provider's `api_key_env`; `.env` is git-ignored.

server:
  host: 127.0.0.1
  port: 8000
  cors_origins: []
  max_body_bytes: 20971520
  trusted_hosts: [127.0.0.1, localhost, "::1", testserver]
  log_level: INFO
  log_format: text
  log_file: null

storage:
  data_dir: ./data
  db_filename: omninexus.db
  keep_partial_on_disconnect: true

gateway:
  default_model: openai:gpt-4o-mini
  # Per-model fallback chains are declared under `models`. If the requested
  # model's whole chain is unconfigured, the gateway may route to another
  # configured model and marks the turn as degraded/rerouted.
  fallback_models: []
  connect_timeout_s: 8
  request_timeout_s: 90
  first_token_timeout_s: 45
  max_retries: 2
  retry_backoff_s: 0.6
  retry_max_backoff_s: 8
  rate_limit_rpm: 120
  rate_limit_max_wait_s: 1.5
  max_output_tokens: 2048
  temperature: 0.7
  top_p: 1.0
  context_reserve_tokens: 512
  # Keep source URLs out of final.content by default (TTS would read them).
  # Citations remain available via the SSE citations event and citations API.
  citations_in_content: false
  max_history_messages: 200

prompts:
  default_profile: default
  max_template_chars: 32000
  allow_custom_profiles: true

memory:
  # Reserved for future use. The external memory pipeline is NOT part of this
  # release: this adapter is disabled by default and the formal memory mechanism
  # is the local conversation archive + recent-window context.
  # To develop against a future implementation set enabled: true and base_url,
  # or use OMNI_MEMORY_ENABLED=1 + OMNI_MEMORY_BASE_URL.
  enabled: false
  base_url: ""
  contract_version: "1.0"
  health_path: /health
  query_path: /v1/memory/query
  write_path: /v1/memory/write
  auth_token_env: OMNI_MEMORY_TOKEN
  health_interval_s: 30
  health_timeout_ms: 600
  query_timeout_ms: 1200
  write_timeout_ms: 1500
  circuit_failures: 3
  circuit_cooldown_s: 30
  top_k: 5
  max_items: 8
  max_context_tokens: 700
  outbox_max: 2000
  async_writeback: true

search:
  # Only the current user query (trimmed) is ever sent to the search provider.
  enabled: false
  provider: tavily
  top_k: 5
  timeout_s: 10
  max_query_chars: 256
  tavily:
    api_key_env: TAVILY_API_KEY
    base_url: https://api.tavily.com
  brave:
    api_key_env: BRAVE_SEARCH_API_KEY
    base_url: https://api.search.brave.com
  searxng:
    base_url: http://127.0.0.1:8888
  custom:
    endpoint: ""
    api_key_env: ""
    auth_header: Authorization
    auth_scheme: Bearer

providers:
  openai:
    type: openai
    label: OpenAI
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
  anthropic:
